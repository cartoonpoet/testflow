<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>PoC-3 — 두 번째 문서</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: system-ui, "Malgun Gothic", sans-serif;
      }
      .abs {
        position: absolute;
      }
      input {
        font-size: 14px;
        padding: 6px 9px;
      }
      button {
        font-size: 14px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <!--
      ★ **전체 이동**(새 문서)으로 도달하는 페이지다.
        SPA 의 pushState 와 달리 여기서는 문서가 통째로 갈리므로
        `context.addInitScript()` 가 **새 문서에 다시 주입되지 않으면 리스너가 죽는다.**
        녹화가 여기서 끊기는지가 이 파일의 유일한 존재 이유다.
    -->
    <h1 class="abs" style="left: 40px; top: 20px; font-size: 18px; margin: 0">두 번째 문서</h1>

    <label class="abs" for="memo" style="left: 40px; top: 76px; font-size: 13px">메모</label>
    <input class="abs" id="memo" style="left: 40px; top: 98px; width: 300px; height: 34px" />

    <button class="abs" id="complete" style="left: 360px; top: 98px; width: 110px; height: 34px">
      완료 처리
    </button>

    <!-- ★ 비밀번호 승격 검증용. `type="password"` 는 값을 수집하지 않고 `{{password}}` 참조만 남아야 한다.
         전체 이동으로 도달한 **새 문서**에 두는 것이 핵심이다 — 재주입이 안 되면 여기서 조용히 실패한다. -->
    <label class="abs" for="pw" style="left: 40px; top: 152px; font-size: 13px">승인 비밀번호</label>
    <input class="abs" id="pw" type="password" style="left: 40px; top: 174px; width: 300px; height: 34px" />

    <div class="abs" id="page2-out" style="left: 40px; top: 224px; font-size: 13px">completed=0 memo=""</div>

    <script>
      let n = 0;
      document.getElementById("complete").addEventListener("click", () => {
        n += 1;
        document.getElementById("page2-out").textContent =
          'completed=' + n + ' memo="' + document.getElementById("memo").value + '"';
      });
    </script>
  </body>
</html>
