<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="TestFlow">
  <!--
    TestFlow 브랜드 마크 · 「지켜보는 흐름」

      · 둥근 타일           = 실행을 지켜보는 화면(뷰포트).   토큰 `color-logo-mark`     #49c493
      · 오른쪽으로 오르는 계단 = 테스트 스텝이 흘러가는 경로.   토큰 `color-logo-mark-ink` #10201b
      · 경로 끝의 뚫린 원     = 지금 실행 중인 스텝(라이브 인디케이터).

    ★ public/ 정적 파일이라 CSS 변수를 쓸 수 없어 HEX 를 직접 적는다.
      두 값은 globals.css `@theme static` 의 토큰과 1:1 로 일치한다.
      토큰을 바꾸면 이 파일과 apple-touch-icon 생성기도 같이 바꿔야 한다.

    ★ <text> 를 쓰지 않는다 - 폰트 없는 환경에서 렌더가 깨지기 때문이다.
      모든 형태는 path/circle 기하로만 만들었다.

    ★ 이 주석 안에 연속 하이픈(XML 주석 종결자와 같은 토큰)을 쓰지 않는다.
      SVG 는 엄격한 XML 로 파싱되므로 그 한 글자에 파일 전체가 렌더되지 않는다.
      그래서 토큰 이름을 `color-...` 로만 적는다. (렌더 검증에서 실제로 걸렸다.)
  -->
  <path fill="#49c493" d="M0 9.6A9.6 9.6 0 0 1 9.6 0h12.8A9.6 9.6 0 0 1 32 9.6v12.8A9.6 9.6 0 0 1 22.4 32H9.6A9.6 9.6 0 0 1 0 22.4Z"/>
  <path fill="none" stroke="#10201b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" d="M7.4 24.4h7.2v-12h2.6"/>
  <circle cx="23.4" cy="12.4" r="4.9" fill="#10201b"/>
  <circle cx="23.4" cy="12.4" r="2" fill="#49c493"/>
</svg>
