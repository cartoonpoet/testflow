# PnP 대신 node-modules linker 를 쓴다.
# 근거: Playwright(브라우저 바이너리 경로 해석), NestJS(런타임 reflect-metadata/DI),
#       typescript-eslint(타입 정보 로딩)가 모두 물리적 node_modules 를 전제로 동작한다.
nodeLinker: node-modules

# WSL + /mnt/c 경로에서 install 이 느리므로 압축 레벨을 낮춘다
compressionLevel: mixed

enableGlobalCache: true

# NOTE: `yarn install` 은 아래 경고 1건을 남긴다 — 알려진 양성(benign)이다.
#   YN0060: ioredis 6.0.0 doesn't satisfy what typeorm requests (^5.0.4)
# typeorm 의 ioredis peer 는 optional 이고 TypeORM 의 Redis 쿼리 캐시 전용이다.
# 우리는 그 기능을 쓰지 않으며, BullMQ 6 은 ioredis >=5.0.0 을 명시 지원한다.
# 이 한 건을 지우려고 logFilters 를 넣으면 다른 peer 경고까지 가려질 위험이 있어 그대로 둔다.
